name: CI

# The main quality gate for cabuya.org.
#
# Gates appended by later migration tasks (keep this list current):
#   - checks:catalogue             (Task 16 — every check id documented)
#   - perf:budgets                 (Task 34 — per-route JS budgets)
#   - a11y:check                   (Task 35 — Playwright + axe route matrix)
#   - E2E journeys                 (Task 47)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · types · tests · build · content gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (lint + format)
        run: pnpm run biome:check

      - name: Astro check (types)
        run: pnpm run astro:check

      - name: Unit tests
        run: pnpm run test

      - name: Protocol gate — spec:check (strict)
        run: pnpm run spec:check:strict

      - name: Protocol gate — spec:boundary
        run: pnpm run spec:boundary

      - name: Protocol gate — registry:check (strict)
        run: pnpm run registry:check:strict

      # The badge endpoint runs at the edge, where there is no filesystem to
      # read `registry/` from, so the id list is inlined at build time. This
      # fails when a new entry landed without regenerating it — the alternative
      # is a publisher whose own badge 404s.
      - name: Protocol gate — the badge id list matches the registry
        run: pnpm run registry:ids:check

      - name: Validator — build and test the workspace package
        run: pnpm run validator:build && pnpm run validator:test

      # /join promises a backlog pre-populated with well-specified work. This
      # is that backlog, generated from the checks that are catalogued and not
      # yet implemented — it goes stale the moment one of them ships.
      - name: Contribution gate — the day-one issue list matches the catalogue
        run: pnpm run issues:day-one:check

      # llms.txt is the first file an agent reads, which makes it the worst
      # possible place for stale copy: a person skims a wrong sentence, an
      # agent acts on it. Generated from the same modules the site renders
      # from; this fails when the committed copy has drifted.
      - name: Agent gate — llms.txt matches the site
        run: pnpm run llms:check

      - name: Build
        run: pnpm run build

      - name: Security gate — the validator endpoint keeps nothing (strict)
        run: pnpm run retention:check:strict

      - name: Content gate — /internal never reaches production (strict)
        run: pnpm run internal:check:strict

      # Reads the compiled stylesheet, because the question is not what we
      # wrote but which declaration wins. The mapping this guards spent several
      # tasks losing silently to the typography plugin's defaults — invisible
      # in light mode, unreadable in dark.
      - name: Design gate — prose uses the palette (strict)
        run: pnpm run prose:check:strict

      # Runs AFTER the site build on purpose: the gate's last assertion
      # cross-checks every check id against the anchors on the built
      # /developers/validator/checks page. That page arrives in Task 26, and
      # placing the step here means the assertion activates on its own —
      # no second CI edit, no window where the page and the catalogue drift.
      - name: Protocol gate — checks:catalogue (strict)
        run: pnpm run checks:catalogue:strict

      - name: Content gate — Markdown twins (strict)
        run: pnpm run md:check:strict

      - name: Content gate — language integrity (strict)
        run: pnpm run lang:check:strict

      - name: Content gate — SEO (strict)
        run: pnpm run seo:check:strict

      - name: Content gate — ES/EN parity (strict)
        run: pnpm run parity:check:strict

      - name: Content gate — redirects (strict)
        run: pnpm run redirects:check:strict

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use: git commit -s)"
              missing=1
            fi
          done
          exit $missing
