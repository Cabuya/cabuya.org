# Cloudflare Pages configuration.
#
# Two KV namespaces, and the split between them is the point. `VALIDATE_RATE`
# holds two integer counters with TTLs and nothing else — the endpoint that
# fetches documents on request is deliberately the one place with the least
# state of all (`functions/api/validate.ts`, `docs/SECURITY.md`).
# `REGISTRY_STATUS` holds measured conformance, written *only* by the
# revalidation cron through a scoped API token and read by the badge endpoint
# and the registry pages. Nothing else about this site is stateful.
#
# Measured state lives here rather than in git because a conformance level in a
# file is a conformance level somebody can edit in a pull request. The Functions
# have no write path to it at all.
#
# Local development:
#   pnpm run build
#   pnpm exec wrangler pages dev dist --kv VALIDATE_RATE --kv REGISTRY_STATUS
#
# `--kv` creates a local namespace on the fly, so no account setup is needed to
# work on the Functions; with an empty namespace every badge renders its honest
# `not yet measured` state. In production the namespace ids are set in the Pages
# dashboard rather than committed here.

name = "cabuya-org"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"

# The rate counters. `preview_id` and `id` are configured in the dashboard;
# leaving them out of the repository keeps a namespace id from being mistaken
# for a secret that leaked, and there is nothing sensitive in one anyway.
[[kv_namespaces]]
binding = "VALIDATE_RATE"

# Measured conformance, written only by `.github/workflows/revalidate.yml`.
[[kv_namespaces]]
binding = "REGISTRY_STATUS"
