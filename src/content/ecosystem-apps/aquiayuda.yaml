name: AquíAyuda
url: https://www.aquiayuda.com/
aliases: []
category: logistics
featured: false
order: 5
logo: /images/ecosystem/aquiayuda/logo.webp
logoAuthorization: public_favicon_only
monogram: AA
tagline:
  es: Acopio y ayuda por cercanía
  en: Collection and aid by proximity
what:
  es: >-
    Centraliza información de ayudas tras el terremoto: centros de acopio por
    municipio (qué falta y qué hay), ayuda entre personas y un mapa ordenable
    por cercanía. Disponible para todo Colombia.
  en: >-
    Centralizes post-quake aid information: collection centers by municipality
    (what is needed and what is covered), person-to-person help, and a map
    sortable by proximity. Available across Colombia.
how:
  es: >-
    Usas tu ubicación o eliges un municipio; revisas centros, necesidades e
    inventario; contactas por WhatsApp cuando aplica. La ficha declara que
    reúne datos de fuentes como Ayudas Pereira, Corag, Pereira Responde y
    Pereira Unida — no inventa la información.
  en: >-
    Use your location or pick a municipality; review centers, needs and
    inventory; contact via WhatsApp when relevant. The site states it reunites
    data from sources such as Ayudas Pereira, Corag, Pereira Responde and
    Pereira Unida — it does not invent the information.
overview:
  es: >-
    AquíAyuda reúne en un solo lugar centros de acopio (necesidades e
    inventario), ayuda entre personas con WhatsApp, voluntariado y un mapa de
    la ayuda. El hero y la descripción del sitio lo plantean para Colombia
    entero tras el terremoto: encontrar el centro más cercano, ver qué necesita
    y cómo llegar.
  en: >-
    AquíAyuda brings together collection centers (needs and inventory),
    person-to-person help with WhatsApp, volunteering, and an aid map. The
    site’s hero and description frame it for Colombia after the quake: find the
    nearest center, see what it needs, and how to get there.
features:
  - es: Centros de acopio por municipio, con qué necesitan y qué tienen cubierto
    en: Collection centers by municipality, with needs and what is already covered
  - es: Ordenación por cercanía con ubicación o selección manual de municipio
    en: Sort by proximity using location or a manual municipality pick
  - es: Ayuda entre personas (pedidos y ofrecimientos) con contacto por WhatsApp
    en: Person-to-person help (requests and offers) with WhatsApp contact
  - es: Mapa de la ayuda, refugios y zonas de acopio señaladas
    en: Aid map, shelters and marked collection zones
  - es: Agrega fuentes públicas (p. ej. Ayudas Pereira, Corag, Pereira Responde, Pereira Unida)
    en: Aggregates public sources (e.g. Ayudas Pereira, Corag, Pereira Responde, Pereira Unida)
tools:
  - es: Listado de municipios y centros de acopio
    en: Municipality and collection-center directory
  - es: «Quién necesita ayuda» / «Quiero ayudar» (ayuda entre personas)
    en: “Who needs help” / “I want to help” (person-to-person)
  - es: «Qué falta y qué hay» por municipio
    en: “What’s missing and what’s covered” by municipality
  - es: Mapa de la ayuda
    en: Aid map
  - es: Formularios de donación, voluntariado y unión a un centro
    en: Donation, volunteer, and join-a-center forms
audience:
  es: Personas que quieren donar, ofrecerse o encontrar un centro cercano en Colombia.
  en: People who want to donate, volunteer, or find a nearby center in Colombia.
coverage:
  es: Municipios con centros registrados en Colombia (según las fuentes que agrega).
  en: Municipalities with registered centers in Colombia (per the sources it aggregates).
limits:
  es: >-
    Los teléfonos de contacto de los centros pueden exigir sesión iniciada.
    AquíAyuda no opera Corag ni las demás fuentes; solo las reúne. No
    encontramos documentación pública de API ni MCP (las rutas /api y /mcp
    sirven el SPA).
  en: >-
    Center contact phones may require a signed-in session. AquíAyuda does not
    operate Corag or the other sources; it reunites them. We did not find
    public API or MCP documentation (/api and /mcp serve the SPA).
integrations:
  publicApi: unknown
  publicMcp: unknown
  notes:
    es: >-
      No encontramos documentación pública de API ni MCP en el sitio. Si la
      tienen, indícalo en el formulario de inclusión.
    en: >-
      We did not find public API or MCP documentation on the site. If you have
      either, note it in the listing request form.
active: true
