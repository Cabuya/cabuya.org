name: Pereira Responde
url: https://pereiraresponde.co/
aliases: []
category: damage
featured: false
order: 10
logo: /images/ecosystem/pereiraresponde/logo.webp
logoAuthorization: public_favicon_only
monogram: PR
tagline:
  es: Infraestructura en el mapa
  en: Infrastructure on the map
what:
  es: "Mapa ciudadano de infraestructura en Pereira: edificios, vías y centros de apoyo. Cada registro puede llevar hasta tres fotos."
  en: "A citizen map of infrastructure in Pereira: buildings, roads and support centers. Each report can include up to three photos."
how:
  es: Marcas el lugar, eliges el tipo de afectación, adjuntas fotos y publicas. Hay atajos a acopio y refugio cercanos, descarga de datos y una API pública documentada.
  en: Mark the place, choose the damage type, attach photos and publish. Nearby collection and shelter shortcuts, data download, and a documented public API.
apiDocsUrl: https://pereiraresponde.co/api/docs
active: true
overview:
  es: "Mapa ciudadano centrado en infraestructura de Pereira: edificios, vías y centros de apoyo. Cada registro puede incluir hasta tres fotos, con atajos a acopio y refugio cercanos."
  en: "A citizen map focused on Pereira infrastructure: buildings, roads, and support centers. Each record can include up to three photos, with shortcuts to nearby collection and shelter points."
features:
  - es: Reporte geolocalizado de afectación a infraestructura
    en: Geolocated infrastructure damage reports
  - es: Hasta tres fotos por registro
    en: Up to three photos per record
  - es: Atajos a acopio y refugio cercanos
    en: Shortcuts to nearby collection and shelter points
  - es: Descarga de datos y API pública documentada
    en: Data download and a documented public API
tools:
  - es: Mapa de reportes de infraestructura
    en: Infrastructure reports map
  - es: Documentación de API en /api/docs
    en: API documentation at /api/docs
  - es: Ejemplo para desarrolladores en /developers/example/
    en: Developer example at /developers/example/
audience:
  es: Ciudadanía que reporta daños; equipos que consultan el estado de infraestructura en Pereira.
  en: Residents reporting damage; teams checking infrastructure status in Pereira.
coverage:
  es: Enfocada en Pereira (infraestructura y puntos de apoyo cercanos).
  en: Focused on Pereira (infrastructure and nearby support points).
limits:
  es: Si hay peligro inmediato, el sitio indica llamar al 123. Listar aquí no es un aval técnico de los reportes.
  en: If there is immediate danger, the site says to call 123. Listing here is not a technical endorsement of reports.
integrations:
  publicApi: yes
  publicMcp: unknown
  apiDocsUrl: https://pereiraresponde.co/api/docs
  developersUrl: https://pereiraresponde.co/developers/example/
  notes:
