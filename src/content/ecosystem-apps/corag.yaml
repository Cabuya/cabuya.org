name: Corag Ayuda Directa
url: https://ayuda.cabuya.org
aliases: []
category: matching
featured: true
order: 0
logo: /images/ecosystem/corag/logo.webp
logoDark: /images/ecosystem/corag/logo-light.webp
logoAuthorization: authorized
monogram: C
tagline:
  es: Ayuda con evidencia
  en: Aid with evidence
what:
  es: La aplicación donde se publica una necesidad, se ofrece ayuda, se aporta y se revisa la evidencia de cada entrega.
  en: The application where a need is published, help is offered, contributions happen, and the evidence of every delivery is reviewed.
how:
  es: "Mapa vivo de solicitudes y personas disponibles. Corag es un nodo de esta red: no reemplaza a las demás apps — se alimenta con ellas."
  en: "A live map of requests and people ready to help. Corag is one node in this network: it does not replace the other apps — it feeds with them."
active: true
overview:
  es: "Ayuda Directa es la aplicación de Corag: publica necesidades y ofrecimientos, aporta y deja evidencia pública de cada entrega. Forma parte de una red abierta — otras apps pueden leer y escribir sobre la misma API."
  en: "Ayuda Directa is Corag’s application: publish needs and offers, contribute, and leave public evidence of every delivery. It is part of an open network — other apps can read and write against the same API."
features:
  - es: Mapa vivo de solicitudes y personas disponibles en emergencias activas
    en: Live map of requests and people ready to help across active emergencies
  - es: Publicación de necesidades (request) y ofrecimientos (offer) con contacto consentido
    en: Publish needs (request) and offers with consented contact
  - es: Aportes y evidencia pública de entregas
    en: Contributions and public delivery evidence
  - es: API pública sin autenticación, idempotente por source + externalId
    en: Public API with no auth, idempotent via source + externalId
  - es: Servidor MCP remoto para agentes (listar emergencias, publicar solicitud u ofrecimiento)
    en: Remote MCP server for agents (list emergencies, publish request or offer)
tools:
  - es: listar_emergencias — emergencias activas y slugs
    en: listar_emergencias — active emergencies and slugs
  - es: publicar_solicitud — publicar una necesidad
    en: publicar_solicitud — publish a need
  - es: publicar_ofrecimiento — publicar un ofrecimiento
    en: publicar_ofrecimiento — publish an offer
  - es: GET/POST /api/public/v1/help — descubrir y publicar en la red
    en: GET/POST /api/public/v1/help — discover and publish on the network
audience:
  es: Personas afectadas, voluntarios, organizaciones y desarrolladores que integran clientes sobre la misma red de datos.
  en: Affected people, volunteers, organizations, and developers building clients on the same data network.
coverage:
  es: Emergencias activas publicadas en Ayuda Directa (Colombia y las que la operación active).
  en: Active emergencies published in Ayuda Directa (Colombia and whichever the operation activates).
limits:
  es: cabuya.org explica el modelo; la operación vive en ayuda.cabuya.org. No inventamos cifras en vivo en esta ficha.
  en: cabuya.org explains the model; the live operation is at ayuda.cabuya.org. This card does not invent live counts.
